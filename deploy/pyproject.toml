[project]
name = "email-catchup-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-workflows[mistralai]>=3.17.1",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]